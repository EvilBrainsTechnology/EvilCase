name: Pull request state

# One state label on an agent's open pull request, ci-failed on any of this repository's. The
# pull_request_target events only read the payload and write labels; nothing from the head runs.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled, closed]
  issues:
    types: [closed]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write
  issues: write

jobs:
  state:
    if: >-
      (github.event.action != 'labeled'
        || contains(fromJSON('["agent-in-progress","agent-done","waiting-for-agent"]'), github.event.label.name))
      && (github.event_name != 'issue_comment' || github.event.issue.pull_request)
      && (github.event_name != 'workflow_run'
        || contains(fromJSON('["success","failure","timed_out"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    steps:
      - name: Update the labels
        uses: actions/github-script@v9
        with:
          script: |
            const STATE = ['agent-in-progress', 'agent-done', 'waiting-for-agent'];
            const OWNER = 'vdolek';
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const payload = context.payload;

            const remove = (number, name) => github.rest.issues
              .removeLabel({ ...repo, issue_number: number, name })
              .catch((error) => { if (error.status !== 404) throw error; });
            const add = (number, name) =>
              github.rest.issues.addLabels({ ...repo, issue_number: number, labels: [name] });
            const setState = async (number, labels, target) => {
              for (const name of labels.filter((name) => STATE.includes(name) && name !== target)) {
                await remove(number, name);
              }
              if (!labels.includes(target)) await add(number, target);
            };

            if (context.eventName === 'workflow_run') {
              const run = payload.workflow_run;
              const { data: prs } = await github.rest.pulls.list({
                ...repo, head: `${repo.owner}:${run.head_branch}`, state: 'open',
              });
              for (const pr of prs.filter((pr) => pr.head.sha === run.head_sha)) {
                const labels = pr.labels.map((label) => label.name);
                if (run.conclusion === 'success') {
                  if (labels.includes('ci-failed')) await remove(pr.number, 'ci-failed');
                  continue;
                }
                if (labels.includes('agent-done')) await setState(pr.number, labels, 'waiting-for-agent');
                if (labels.includes('ci-failed')) continue;
                await add(pr.number, 'ci-failed');
                await github.rest.issues.createComment({
                  ...repo, issue_number: pr.number, body: `CI failed: ${run.html_url}`,
                });
              }
              return;
            }

            const target = payload.pull_request ?? payload.issue;
            if (payload.action === 'closed') {
              for (const name of target.labels.map((label) => label.name)) {
                if ([...STATE, 'ci-failed'].includes(name)) await remove(target.number, name);
              }
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: target.number });
            if (pr.state !== 'open' || pr.head.repo?.full_name !== pr.base.repo.full_name) return;
            if (!/^(claude|loop|review)\//.test(pr.head.ref)) return;
            const labels = pr.labels.map((label) => label.name);
            const present = labels.filter((name) => STATE.includes(name));

            if (context.eventName === 'pull_request_target') {
              if (payload.action === 'labeled') {
                if (present.includes(payload.label.name)) await setState(pr.number, labels, payload.label.name);
              } else if (present.length === 0) {
                await setState(pr.number, labels, 'agent-in-progress');
              }
              return;
            }

            const source = payload.comment ?? payload.review;
            const body = source.body ?? '';
            const byAgent = body.includes('Generated by [Claude Code]')
              || body.includes('Generated with [Claude Code]');
            if (source.user.login === OWNER && !byAgent) {
              if (payload.review?.state === 'approved' && !body) return;
              if (present.includes('agent-in-progress') || present.includes('waiting-for-agent')) return;
              await setState(pr.number, labels, 'waiting-for-agent');
            } else if (context.eventName === 'issue_comment'
              && ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(source.author_association)
              && /^## Code Review\s*$/m.test(body) && !labels.includes('ci-failed')) {
              await setState(pr.number, labels, 'agent-done');
            }
