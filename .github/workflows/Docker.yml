name: Docker

# Build the image on every master push and publish a versioned one from a GitHub Release
on:
  push:
    branches:
      - master
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Required by actions/attest-build-provenance
  attestations: write
  id-token: write
  # Required by the CI workflow this one calls: a called workflow cannot hold more than its caller
  actions: read
  checks: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/evilbrainstechnology/evilcase

jobs:
  # Lint, build and test. Called rather than duplicated, so master and release runs go through the same
  # steps a pull request does — and a release, which CI.yml is not triggered by, is covered as well.
  ci:
    name: CI
    uses: ./.github/workflows/CI.yml

  build-and-push:
    name: Build and Push Image
    needs: ci
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # Set up Buildx, needed for the GitHub Actions build cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate against the GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive the image tags: semver plus latest from a release, edge from master
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=master-,enable=${{ github.ref == 'refs/heads/master' }}
            # A manual run from another branch matches none of the above, and an empty tag list would
            # push nothing and leave the attestation without a digest.
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/master' }}
          # GitHub classifies the proprietary license as "other", which the action turns into an empty
          # licenses label — a public image with no license stated reads as free to use
          labels: |
            org.opencontainers.image.licenses=LicenseRef-Proprietary
            org.opencontainers.image.vendor=Martin Volek

      # The release tag is the assembly version; anything else is unversioned
      - name: Resolve assembly version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      # Build and push the image
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Attach a signed provenance statement to the pushed image. It is not written to the registry:
      # an OCI registry has no way to attach one artifact to another, so the statement would land as
      # a package version of its own tagged sha256-<digest of the image it describes>, one per push.
      # Stored on GitHub instead, `gh attestation verify oci://<image> --repo <owner/repo>` resolves
      # the digest from the registry and looks the statement up there.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false
