name: CI

# Run the workflow on every pull request, whatever it targets. Filtering to master would leave every
# layer of a stacked pull request unchecked, since those target the branch below them - four of them
# had never been built when this filter was removed. The master and release paths call it from
# Docker.yml instead, so the image is only published from a commit that passed this workflow.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

# Define the jobs for the workflow
jobs:
  lint-and-build-test:
    name: Lint, Build, and Test Solution
    runs-on: ubuntu-latest

    # The tests that need a server ignore themselves without one, so this is what keeps them running
    # at all; EVILCASE_TESTS_POSTGRES points them at it and each fixture creates a database of its own.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # Enforce the AI instruction length limits from .claude/instruction-limits.json; the base
      # branch is fetched so the report can show the difference a pull request makes
      - name: Check instruction length limits
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch --quiet --depth=1 origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF" || true
          else
            git fetch --quiet --deepen=1 || true
          fi
          pwsh -NoProfile -File .github/scripts/Check-InstructionLimits.ps1

      # Setup .NET Core
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json

      # Restore tools
      - name: Restore .NET tools
        run: dotnet tool restore
        working-directory: ./src

      # Restore dependencies
      - name: Restore .NET dependencies
        run: dotnet restore
        working-directory: ./src

      # Lint the code
      - name: Lint the code with dotnet-format
        run: dotnet r format-check
        working-directory: ./src

      # Build the solution
      - name: Build the solution
        run: dotnet r build -- --no-restore
        working-directory: ./src

      # Test the solution
      - name: Run tests
        run: dotnet r test -- --no-build --logger "trx;LogFileName=test-results.trx"
        working-directory: ./src
        env:
          EVILCASE_TESTS_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres

      # Upload test results
      - name: Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Tests Results
          path: "**/test-results.trx"
          reporter: dotnet-trx

      # Generate SQL script
      - name: Generate SQL script
        run: dotnet r generate-sql-script -- --no-build
        working-directory: ./src
      
      # Generate SQL script
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SQL
          path: src/database.sql
