name: CI

# Run the workflow on every pull request, whatever it targets. Filtering to master would leave every
# layer of a stacked pull request unchecked, since those target the branch below them - four of them
# had never been built when this filter was removed. The master and release paths call it from
# Docker.yml instead, so the image is only published from a commit that passed this workflow.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

# A new push to a pull request cancels the run of the one before; master and release runs finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Define the jobs for the workflow
jobs:
  lint-and-build-test:
    name: Lint, Build, and Test Solution
    runs-on: ubuntu-latest
    # A run takes about four minutes; a hung test fails it instead of holding the runner for hours
    timeout-minutes: 20

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # Enforce the AI instruction length limits from .claude/instruction-limits.json; the base
      # branch is fetched so the report can show the difference a pull request makes
      - name: Check instruction length limits
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch --quiet --depth=1 origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF" || true
          else
            git fetch --quiet --deepen=1 || true
          fi
          pwsh -NoProfile -File .github/scripts/Check-InstructionLimits.ps1

      # Setup .NET Core
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json

      # Node.js builds the frontend libraries and fonts during the .NET build
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/App/EvilCase.App/package-lock.json

      # Restore tools
      - name: Restore .NET tools
        run: dotnet tool restore
        working-directory: ./src

      # Restore dependencies
      - name: Restore .NET dependencies
        run: dotnet restore
        working-directory: ./src

      # Build the solution; it enforces formatting and analyzers as errors, so no separate format check
      - name: Build the solution
        run: dotnet r build -- --no-restore
        working-directory: ./src

      # Test the solution
      - name: Run tests
        run: dotnet r test -- --no-build --logger "trx;LogFileName=test-results.trx" --blame-hang-timeout 10m
        working-directory: ./src

      # Upload test results
      - name: Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Tests Results
          path: "**/test-results.trx"
          reporter: dotnet-trx

      # Generate SQL script
      - name: Generate SQL script
        run: dotnet r generate-sql-script -- --no-build
        working-directory: ./src
      
      # Generate SQL script
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SQL
          path: src/database.sql
