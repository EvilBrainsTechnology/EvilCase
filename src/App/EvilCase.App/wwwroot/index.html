<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EvilCase</title>
    <base href="/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="lib/tabler/tabler.min.css" />
    <link rel="stylesheet" href="_content/TabBlazor/css/tabblazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Blazor scoped styles; TabBlazor ships component CSS (tooltip, dropdown, datepicker) only through this bundle. -->
    <link rel="stylesheet" href="EvilBrains.EvilCase.App.styles.css" />
</head>

<body>
    <script>
        // Apply the OS theme before Blazor boots so the loader matches; ThemeSwitch takes over from there.
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.body.setAttribute("data-bs-theme", "dark");
        }
    </script>
    <div id="app">
        <div class="page page-center">
            <div class="container container-tight py-4 text-center">
                <!-- AppIcons.Scale inlined; keep the two in sync. -->
                <h1 class="mb-3 d-flex align-items-center justify-content-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="text-primary me-2" width="36" height="36"
                         viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M7 20l10 0" />
                        <path d="M6 6l6 -1l6 1" />
                        <path d="M12 3l0 17" />
                        <path d="M9 12l-3 -6l-3 6a3 3 0 0 0 6 0" />
                        <path d="M21 12l-3 -6l-3 6a3 3 0 0 0 6 0" />
                    </svg>EvilCase
                </h1>
                <div class="text-secondary mb-2">
                    <span class="boot-step-download">1/3 Stahování</span>
                    <span class="boot-step-start">2/3 Spouštění aplikace</span>
                </div>
                <div class="progress boot-progress">
                    <div class="progress-bar boot-progress-bar"></div>
                    <div class="progress-bar progress-bar-indeterminate boot-progress-indeterminate"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/TabBlazor/js/tabblazor.js"></script>
</body>

</html>
