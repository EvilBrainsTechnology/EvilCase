name: evilcase-dev

# Throwaway PostgreSQL for local development. Matches the connection string in
# src/EvilCase.Host/.env.example, so a fresh clone needs no other setup. Not part of the deployed
# stack — see docker-compose.yml for that.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evilcase
    # The data directory lives in RAM, so `down` wipes it and the next start migrates and seeds an
    # empty database again. The image declares /var/lib/postgresql a volume, so without a mount of
    # our own every run would leave an anonymous one behind; PGDATA sits inside it.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evilcase"]
      interval: 2s
      timeout: 3s
      retries: 30
