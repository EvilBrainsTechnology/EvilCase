name: CI result signal

# Mirror the CI result onto the pull request: a red run adds the ci-failed flag and turns
# agent-done into waiting-for-agent; a green run removes the flag.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write
  issues: write

jobs:
  signal:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Update the pull request labels
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const failed = run.conclusion === 'failure';
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const prs = await github.rest.pulls.list({
              ...repo,
              head: `${context.repo.owner}:${run.head_branch}`,
              state: 'open',
            });
            for (const pr of prs.data) {
              if (run.head_sha !== pr.head.sha) continue;
              const labels = pr.labels.map((label) => label.name);
              if (failed) {
                if (labels.includes('agent-done')) {
                  await github.rest.issues.removeLabel({
                    ...repo, issue_number: pr.number, name: 'agent-done',
                  }).catch(() => {});
                  await github.rest.issues.addLabels({
                    ...repo, issue_number: pr.number, labels: ['waiting-for-agent'],
                  });
                }
                if (labels.includes('ci-failed')) continue;
                await github.rest.issues.addLabels({
                  ...repo, issue_number: pr.number, labels: ['ci-failed'],
                });
                await github.rest.issues.createComment({
                  ...repo, issue_number: pr.number, body: `CI failed: ${run.html_url}`,
                });
              } else if (labels.includes('ci-failed')) {
                await github.rest.issues.removeLabel({
                  ...repo, issue_number: pr.number, name: 'ci-failed',
                }).catch(() => {});
              }
            }
