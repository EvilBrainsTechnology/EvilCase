<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prihlaseni – EvilCase</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', 'Segoe UI', sans-serif; background: #ECEEF2; color: #14161B; }
    a { color: #2F4FD1; text-decoration: none; } a:hover { color: #1F3AA8; }
  </style>
</head>
<body>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 150px 20px 24px; background: radial-gradient(ellipse 70% 55% at 50% 30%, rgba(59, 91, 219, 0.32), transparent 70%), #14161B; display: flex; flex-direction: column; align-items: center; gap: 24px;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: #FFFFFF;">
    <span style="width: 60px; height: 60px; border-radius: 12px; background: #3B5BDB; display: flex; align-items: center; justify-content: center;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M6 6l6-1 6 1"/><path d="M12 3v17"/><path d="M9 12L6 6l-3 6a3 3 0 0 0 6 0"/><path d="M21 12l-3-6-3 6a3 3 0 0 0 6 0"/></svg>
    </span>
    EvilCase
  </div>

  <div style="display: flex; flex-direction: column; gap: 20px; box-sizing: border-box; width: 462px; padding: 40px; background: #FFFFFF; border: 1px solid #E1E4EA; border-radius: 20px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);">
    <form style="display: flex; flex-direction: column; gap: 20px;">
      <div style="display: flex; flex-direction: column; gap: 6px; text-align: center;">
        <h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em;">Přihlášení</h2>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="l-email" style="font-size: 13px; font-weight: 600;">E-mail</label>
        <input id="l-email" type="email" placeholder="jmeno@example.cz" style="height: 46px; padding: 0 12px; font: inherit; font-size: 15px; border: 1px solid #D5D9E1; border-radius: 10px; background: #FFFFFF;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="l-password" style="font-size: 13px; font-weight: 600;">Heslo</label>
        <input id="l-password" type="password" placeholder="••••••••" style="height: 46px; padding: 0 12px; font: inherit; font-size: 15px; border: 1px solid #D5D9E1; border-radius: 10px; background: #FFFFFF;">
      </div>

      <div style="display: flex; gap: 10px; padding: 12px 14px; background: #FDECEA; border: 1px solid #F1CFCA; border-radius: 10px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9B2C1F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #7F2419;">Nesprávný e-mail nebo heslo.</p>
      </div>

      <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; font: inherit; font-size: 15px; font-weight: 600; color: #FFFFFF; background: #3B5BDB; border: 0; border-radius: 10px; cursor: pointer;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12H3"/><path d="M11 8l4 4-4 4"/><path d="M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></svg>Přihlásit se
      </button>
    </form>
  </div>

  <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 32px; font-size: 14px; color: #8C929D;">
    <span>Česky · datum d. M. yyyy</span>
    <span>Samostatná instalace</span>
  </div>

</div>
</body>
</html>
