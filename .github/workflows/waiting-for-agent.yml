name: Waiting for agent

# An owner comment or review on a pull request turns agent-done into waiting-for-agent, so the
# agent loop sees the pull request as its work. A trigger the agent has already answered — a reply
# or a push newer than the comment — leaves the label as the agent set it.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: waiting-for-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Switch the state label
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload;
            if (payload.issue && !payload.issue.pull_request) return;
            const pr = payload.pull_request ?? payload.issue;
            if (pr.state !== 'open') return;
            const source = payload.comment ?? payload.review;
            const author = source.user.login;
            const body = source.body ?? '';
            if (author === 'claude' || author.endsWith('[bot]')) return;
            if (body.includes('Generated by [Claude Code]') || body.includes('Generated with [Claude Code]')) return;
            if (payload.review && payload.review.state === 'approved' && !body) return;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              ...repo, issue_number: pr.number,
            });
            const names = labels.map((label) => label.name);
            if (names.includes('agent-in-progress') || names.includes('waiting-for-agent')) return;
            const triggeredAt = new Date(source.submitted_at ?? source.created_at);
            const isAgent = (login, text) =>
              login === 'claude' || login.endsWith('[bot]')
              || (text ?? '').includes('Generated by [Claude Code]')
              || (text ?? '').includes('Generated with [Claude Code]');
            const [issueComments, reviewComments, commits] = await Promise.all([
              github.paginate(github.rest.issues.listComments, { ...repo, issue_number: pr.number }),
              github.paginate(github.rest.pulls.listReviewComments, { ...repo, pull_number: pr.number }),
              github.paginate(github.rest.pulls.listCommits, { ...repo, pull_number: pr.number }),
            ]);
            const agentReplied = [...issueComments, ...reviewComments].some(
              (c) => isAgent(c.user.login, c.body) && new Date(c.created_at) > triggeredAt,
            );
            const agentPushed = commits.some(
              (c) => new Date(c.commit.committer.date) > triggeredAt,
            );
            if (agentReplied || agentPushed) return;
            if (names.includes('agent-done')) {
              await github.rest.issues.removeLabel({
                ...repo, issue_number: pr.number, name: 'agent-done',
              }).catch(() => {});
            }
            await github.rest.issues.addLabels({
              ...repo, issue_number: pr.number, labels: ['waiting-for-agent'],
            });
