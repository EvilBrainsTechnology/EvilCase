name: State label

# Keep one state label on an agent's open pull request. pull_request_target only reads the
# payload and writes labels; nothing from the head ref is checked out or executed.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled]
  issue_comment:
    types: [created]

concurrency:
  group: state-label-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  issues: write

jobs:
  label:
    if: >-
      (github.event_name == 'pull_request_target' && (github.event.action != 'labeled'
        || contains(fromJSON('["agent-in-progress","agent-done","waiting-for-agent"]'), github.event.label.name)))
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
        && contains(github.event.comment.body, '## Code Review'))
    runs-on: ubuntu-latest
    steps:
      - name: Set the state label
        uses: actions/github-script@v9
        with:
          script: |
            const state = ['agent-in-progress', 'agent-done', 'waiting-for-agent'];
            const payload = context.payload;
            if (payload.issue && !payload.issue.pull_request) return;
            const number = (payload.pull_request ?? payload.issue).number;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: number });
            if (pr.state !== 'open' || pr.head.repo?.full_name !== pr.base.repo.full_name) return;
            if (!/^(claude|loop|review)\//.test(pr.head.ref)) return;
            const labels = pr.labels.map((label) => label.name);
            const present = labels.filter((name) => state.includes(name));

            let target;
            if (context.eventName === 'issue_comment') {
              const comment = payload.comment;
              if (comment.user.login === 'vdolek') return;
              if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(comment.author_association)) return;
              if (!/^## Code Review\s*$/m.test(comment.body ?? '')) return;
              if (labels.includes('ci-failed')) return;
              target = 'agent-done';
            } else if (payload.action === 'labeled') {
              if (!state.includes(payload.label.name)) return;
              if (!present.includes(payload.label.name)) return;
              target = payload.label.name;
            } else {
              if (present.length > 0) return;
              target = 'agent-in-progress';
            }

            for (const name of present.filter((name) => name !== target)) {
              await github.rest.issues.removeLabel({ ...repo, issue_number: number, name })
                .catch((error) => { if (error.status !== 404) throw error; });
            }
            if (!present.includes(target)) {
              await github.rest.issues.addLabels({ ...repo, issue_number: number, labels: [target] });
            }
