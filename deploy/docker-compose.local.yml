# The whole application in Docker, built from this repository, with its own PostgreSQL next to it.
# For development only: the credentials are constants and the data lives in RAM. See
# docker-compose.yml for the deployed stack.
#
# No project name: `Local-Stack.ps1` derives one per checkout, so worktrees never share containers.
# Start it through that script — a bare `docker compose up` here takes the directory name and two
# checkouts would collide on it.
services:
  app:
    build:
      context: ..
    # Host port 0 lets Docker pick a free one, which is what keeps parallel checkouts apart;
    # `Local-Stack.ps1` prints the resolved address. Set EVILCASE_PORT to pin it.
    ports:
      - "127.0.0.1:${EVILCASE_PORT:-0}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      EvilBrains__EvilCase__ConnectionString: Host=postgres;Port=5432;Database=evilcase;Username=postgres;Password=postgres
      EvilBrains__EvilCase__Auth__Jwt__Key: local-development-key-not-a-secret-0000
      EvilBrains__EvilCase__Auth__Seed__Email: admin@evilcase.local
      EvilBrains__EvilCase__Auth__Seed__Password: DevPassword123!
      # Kestrel serves plain HTTP here and nothing terminates TLS in front, so the middleware could
      # not resolve a target port anyway and would only log a warning per request.
      EvilBrains__EvilCase__Hosting__HttpsRedirection: "false"
      # appsettings.Development.json names a real Seq server; an empty URL leaves the sink out.
      EvilBrains__EvilCase__Logging__Seq__ServerUrl: ""
    # The host migrates on startup and does not retry.
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evilcase
    # No published port: the application reaches it over the compose network, and publishing one
    # would put every checkout's stack back on the same address.
    #
    # The data directory lives in RAM. The image declares /var/lib/postgresql a volume, so without
    # a mount of our own every run would leave an anonymous one behind; PGDATA sits inside it.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evilcase"]
      interval: 2s
      timeout: 3s
      retries: 30
