name: evilcase

services:
  app:
    image: ghcr.io/evilbrainstechnology/evilcase:${EVILCASE_TAG:-latest}
    restart: unless-stopped
    ports:
      # Loopback only: the service trusts the forwarded headers of the proxy in front, so a caller that
      # reaches it directly would dictate its own address and scheme.
      - "127.0.0.1:${EVILCASE_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      EvilBrains__EvilCase__ConnectionString: ${EVILCASE_CONNECTION_STRING:?}
      EvilBrains__EvilCase__Auth__Jwt__Key: ${EVILCASE_JWT_KEY:?}
      # Registration is closed, so an empty database gets its first administrator from here. Optional:
      # unset means no account is created, and an existing user means none is created either way.
      EvilBrains__EvilCase__Auth__Seed__Email: ${EVILCASE_SEED_EMAIL:-}
      EvilBrains__EvilCase__Auth__Seed__Password: ${EVILCASE_SEED_PASSWORD:-}
      EvilBrains__EvilCase__Hosting__BehindReverseProxy: "true"
      # The proxy owns the redirect. Kestrel serves plain HTTP here, so the middleware could not
      # resolve a target port anyway and would only log a warning per request.
      EvilBrains__EvilCase__Hosting__HttpsRedirection: "false"
      # No environment has a Seq server configured by default; an empty URL leaves the sink out.
      EvilBrains__EvilCase__Logging__Seq__ServerUrl: ${EVILCASE_SEQ_URL:-}
      EvilBrains__EvilCase__Logging__Seq__ApiKey: ${EVILCASE_SEQ_API_KEY:-}
      # The bytes of uploaded files; the volume below is mounted here.
      EvilBrains__EvilCase__Files__RootPath: /var/lib/evilcase/files
    volumes:
      - files:/var/lib/evilcase/files
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  files:
