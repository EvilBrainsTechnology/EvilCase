<!DOCTYPE html>
<html lang="cs">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EvilCase</title>
    <base href="/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/ec-fonts.css" />
    <link rel="stylesheet" href="css/ec-tokens.css" />
    <link rel="stylesheet" href="css/ec-components.css" />
    <!-- Blazor scoped styles of the referenced component libraries. -->
    <link rel="stylesheet" href="EvilBrains.EvilCase.App.styles.css" />

<body>
    <div id="app" class="ec">
        <div class="ec-boot">

                    </svg>
                </span>
                EvilCase
            </div>
            <div class="ec-boot-step">
                <span class="ec-boot-step-download">1/3 Stahování</span>
                <span class="ec-boot-step-start">2/3 Spouštění aplikace</span>

            <div class="ec-boot-track">

            </div>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
