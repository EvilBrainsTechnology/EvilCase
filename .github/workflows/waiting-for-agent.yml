name: Waiting for agent

# An owner comment or review on a pull request turns agent-done into waiting-for-agent, so the
# agent loop sees the pull request as its work.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Switch the state label
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload;
            if (payload.issue && !payload.issue.pull_request) return;
            const pr = payload.pull_request ?? payload.issue;
            if (pr.state !== 'open') return;
            const source = payload.comment ?? payload.review;
            const author = source.user.login;
            const body = source.body ?? '';
            if (author === 'claude' || author.endsWith('[bot]')) return;
            if (body.includes('Generated by [Claude Code]') || body.includes('Generated with [Claude Code]')) return;
            if (payload.review && payload.review.state === 'approved' && !body) return;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              ...repo, issue_number: pr.number,
            });
            const names = labels.map((label) => label.name);
            if (names.includes('agent-in-progress') || names.includes('waiting-for-agent')) return;
            if (names.includes('agent-done')) {
              await github.rest.issues.removeLabel({
                ...repo, issue_number: pr.number, name: 'agent-done',
              }).catch(() => {});
            }
            await github.rest.issues.addLabels({
              ...repo, issue_number: pr.number, labels: ['waiting-for-agent'],
            });
